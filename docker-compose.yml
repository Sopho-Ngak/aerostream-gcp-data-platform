# Shared defaults anchor reused by all services to keep ops behavior consistent.
x-defaults: &defaults
  restart: unless-stopped
  init: true
  networks:
    - data-platform
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-hadoop-env: &hadoop-env
  CORE_CONF_fs_defaultFS: hdfs://namenode:9000
  HDFS_CONF_dfs_namenode_rpc___address: namenode:9000
  HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"

x-spark-common: &spark-common
  build:
    context: .
    dockerfile: docker/Dockerfile.spark
  environment: &spark-common-env
    HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    SPARK_IVY_HOME: /tmp/.ivy2
    SPARK_HOME: /opt/spark
    PYSPARK_PYTHON: python3.11
    PYSPARK_DRIVER_PYTHON: python3.11
  volumes: &spark-common-volumes
    - ./src:/opt/spark/work-dir/src
    - ./spark-apps:/opt/spark-apps
    - ./data:/opt/spark-data
    - ./ivy:/tmp/.ivy2
    - ./config/spark:/opt/spark/conf

# Airflow 3 specific common environment
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
    AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__LOGGING__DAG_PROCESSOR_CHILD_PROCESS_LOG_DIRECTORY: /opt/airflow/logs/dag_processor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-api-server:8080/execution/'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__WEBSERVER__RBAC: 'true'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__CORE__DAGS_FOLDER: '/opt/airflow/dags'
    AIRFLOW__CORE__PLUGINS_FOLDER: '/opt/airflow/plugins'
    AIRFLOW__WEBSERVER__BASE_URL: 'http://localhost:8082'
    AIRFLOW__CELERY__BROKER_URL: 'redis://redis:6379/0'
    AIRFLOW__CELERY__RESULT_BACKEND: 'db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@airflow-postgres/${POSTGRES_DB}'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: 'postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@airflow-postgres/${POSTGRES_DB}'

    # security
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    
    AIRFLOW__CELERY__BROKER_TRANSPORT_OPTIONS: "{\"visibility_timeout\": 3600}"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__CELERY__BROKER_CONNECTION_RETRY_ON_STARTUP: "true"
    AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
    
    # Add GCP and other env vars
    GCP_PROJECT_ID: ${GCP_PROJECT_ID}
    GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}
    BIGQUERY_DATASET: ${BIGQUERY_DATASET}
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/config/gcp/gcp-credentials.json
    # SparkSubmitHook uses --master from this connection; conf spark.master alone does not override it.
    AIRFLOW_CONN_SPARK_DEFAULT: 'spark://spark-master:7077'
    PYTHONPATH: /opt/airflow/src
    
  user: "${AIRFLOW_UID}:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes: &airflow-volumes
    # - ./dags:/opt/airflow/dags
    # - ./src:/opt/airflow/src
    # - ./scripts:/opt/airflow/scripts
    # - ./logs/airflow:/opt/airflow/logs
    # - ./config/airflow:/opt/airflow/config
    # - ./data:/opt/airflow/data
    # - ./spark-apps:/opt/airflow/spark-apps
    # - /var/run/docker.sock:/var/run/docker.sock
    - ./config:/opt/airflow/config
    - ./config/gcp:/opt/airflow/config/gcp:ro
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./include:/opt/airflow/include
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./tests:/opt/airflow/tests
  depends_on:
    &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  env_file:
    - .env

services:
  # ==================== KAFKA STACK ====================
  zookeeper:
    <<: *defaults
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/2181"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 512m
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    <<: *defaults
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_BYTES: 10737418240
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 90s
    mem_limit: 1g
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    <<: *defaults
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8083:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    mem_limit: 256m

  # ==================== HADOOP STACK ====================
  namenode:
    <<: *defaults
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      <<: *hadoop-env
      CLUSTER_NAME: aerostream
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode:/hadoop/dfs/name
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9870 && exec 4<>/dev/tcp/127.0.0.1/9000"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    mem_limit: 1g

  datanode:
    <<: *defaults
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    depends_on:
      - namenode
    environment:
      <<: *hadoop-env
      SERVICE_PRECONDITION: namenode:9870 namenode:9000
    volumes:
      - datanode:/hadoop/dfs/data
    mem_limit: 2g

  # One-shot initializer: create required HDFS folders on startup.
  hdfs-init:
    <<: *defaults
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs-init
    restart: "no"
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_started
    environment:
      <<: *hadoop-env
      HADOOP_USER_NAME: root
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init_hdfs_dirs.sh"]

  # ==================== SPARK STACK ====================
  spark-master:
    <<: [*defaults, *spark-common]
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "8080:8080"
      - "7077:7077"
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/7077"]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 90s
    mem_limit: 2g
    environment:
      <<: *spark-common-env
    volumes: *spark-common-volumes

  spark-worker:
    <<: [*defaults, *spark-common]  
    container_name: spark-worker
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--webui-port", "8081", "--cores", "2", "--memory", "2g"]
    mem_limit: 3g
    environment:
      <<: *spark-common-env
    volumes: *spark-common-volumes
    ports:
      - "8081:8081"

  spark-history:
    <<: [*defaults, *spark-common]
    container_name: spark-history
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]
    ports:
      - "18080:18080"
    environment:
      <<: *spark-common-env
      SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=hdfs://namenode:9000/spark-logs"
    volumes: *spark-common-volumes
    mem_limit: 1g

  # ==================== REDIS (for Airflow Celery) ====================
  redis:
    <<: *defaults
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  # ==================== INGESTION SERVICE ====================
  ingestion:
    <<: *defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.ingestion
    container_name: ingestion
    depends_on:
      kafka:
        condition: service_healthy
      hdfs-init:
        condition: service_completed_successfully
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs

  # ==================== STREAMING CONSUMER ====================
  streaming:
    <<: [*defaults, *spark-common]
    container_name: streaming
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      hdfs-init:
        condition: service_completed_successfully
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.pyspark.python=python3.11
      - --conf
      - spark.pyspark.driver.python=python3.11
      - /opt/spark/work-dir/src/streaming/stream_flights.py
    environment:
      <<: *spark-common-env
    volumes: *spark-common-volumes
    mem_limit: 2g

  # ==================== AIRFLOW 3 STACK ====================
  airflow-postgres:
    <<: *defaults
    image: postgres:15
    container_name: airflow-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - airflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # mem_limit: 512m

  airflow-init:
    <<: [*defaults, *airflow-common]
    container_name: airflow-init
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"
        echo
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:0"
        echo
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WWW_USER_USERNAME}  
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WWW_USER_PASSWORD}
    user: "0:0"
    # mem_limit: 512m


  airflow-scheduler:
    <<: [*defaults, *airflow-common]
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "scheduler", "--help"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-api-server:
    <<: [*defaults, *airflow-common]
    container_name: airflow-api-server
    command: api-server
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    # mem_limit: 1g

  airflow-triggerer:
    <<: [*defaults, *airflow-common]
    container_name: airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD", "airflow", "triggerer", "--help"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: [*defaults, *airflow-common]
    container_name: airflow-dag-processor
    command: airflow dag-processor
    healthcheck:
      test: ["CMD", "airflow", "dag-processor", "--help"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: [*defaults, *airflow-common]
    container_name: airflow-worker
    hostname: airflow-worker
    command: celery worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      hdfs-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      # airflow-scheduler:
      #   condition: service_completed_successfully

  # airflow-worker-2:
  #   <<: [*defaults, *airflow-common]
  #   container_name: airflow-worker-2
  #   hostname: airflow-worker-2
  #   command: celery worker
  #   depends_on:
  #     airflow-init:
  #       condition: service_completed_successfully
      # airflow-scheduler:
      #   condition: service_completed_successfully

  # ==================== SUPERSET ====================
  superset-db:
    <<: *defaults
    image: postgres:15
    container_name: superset-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-platform
    mem_limit: 512m

  superset:
    build:
      context: .
      dockerfile: docker/Dockerfile.superset
    container_name: superset
    environment:
      - SUPERSET__SQLALCHEMY_DATABASE_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@superset-db:5432/${POSTGRES_DB}
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
      - SUPERSET_FIRSTNAME=${SUPERSET_FIRSTNAME}
      - SUPERSET_LASTNAME=${SUPERSET_LASTNAME}
      - SUPERSET_EMAIL=${SUPERSET_EMAIL}
      - SUPERSET_PASSWORD=${SUPERSET_PASSWORD}
      # - PYTHONPATH=/app/pythonpath
    volumes:
      - ./config/superset/superset_config.py:/app/pythonpath/superset_config.py
      - ./data/superset:/app/superset_home
      - ./dashboard:/app/dashboard
    command:
      - -c
      - |
        echo 'Initializing Superset database...' &&
        pip install psycopg2-binary &&
        superset db upgrade &&
        superset init &&
        echo 'Creating admin user...' &&
        superset fab create-admin --username ${SUPERSET_USER} --firstname ${SUPERSET_FIRSTNAME} --lastname ${SUPERSET_LASTNAME} --email ${SUPERSET_EMAIL} --password ${SUPERSET_PASSWORD} &&
        gunicorn -b 0.0.0.0:8088 -w 2 --timeout 300 'superset.app:create_app()'
    ports:
      - "8088:8088"
    depends_on:
      superset-db:
        condition: service_healthy
    entrypoint: /bin/bash
    # entrypoint: ["/bin/bash", "/superset_init.sh"]
    networks:
      - data-platform
    mem_limit: 1g

  # ==================== MONITORING ====================
  prometheus:
    <<: *defaults
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    mem_limit: 512m

  grafana:
    <<: *defaults
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_USER_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 512m

  # ==================== HEALTH CHECK ====================
  health-check:
    <<: *defaults
    image: alpine:latest
    container_name: health-check
    depends_on:
      zookeeper:
        condition: service_healthy
      kafka:
        condition: service_healthy
      namenode:
        condition: service_healthy
      # spark-master:
      #   condition: service_healthy
      airflow-postgres:
        condition: service_healthy
      airflow-api-server:
        condition: service_healthy
    command: >
      sh -c "
        echo '🔍 Running health checks...' &&
        echo '✅ All services are healthy!'
      "

# ==================== VOLUMES ====================
volumes:
  # Kafka volumes
  zookeeper-data:
    driver: local
  zookeeper-log:
    driver: local
  kafka-data:
    driver: local
  
  # Hadoop volumes
  namenode:
    driver: local
  datanode:
    driver: local
  
  # Airflow volumes
  airflow-postgres:
    driver: local
  
  # Superset volumes
  superset-db:
    driver: local
  
  # Monitoring volumes
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

  superset-db-data:
    driver: local

# ==================== NETWORKS ====================
networks:
  data-platform:
    driver: bridge