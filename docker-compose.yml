# Shared defaults anchor reused by all services to keep ops behavior consistent.
x-defaults: &defaults
  restart: unless-stopped
  init: true
  networks:
    - data-platform
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-spark-common: &spark-common
  build:
    context: .
    dockerfile: docker/Dockerfile.spark
  environment: &spark-common-env
    SPARK_IVY_HOME: /opt/spark/.ivy2
    SPARK_HOME: /opt/spark
    PYSPARK_PYTHON: python3.11
    PYSPARK_DRIVER_PYTHON: python3.11
    GOOGLE_APPLICATION_CREDENTIALS: /opt/spark/config/gcp/gcp-credentials.json
    GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}
    GCP_PROJECT_ID: ${GCP_PROJECT_ID}
  volumes: &spark-common-volumes
    - ./src:/opt/spark/work-dir/src
    - ./spark-apps:/opt/spark-apps
    - ./data:/opt/spark-data
    - ./config/spark:/opt/spark/conf
    - ./config/gcp:/opt/spark/config/gcp:ro

# Airflow 3 specific common environment
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
    AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__LOGGING__DAG_PROCESSOR_CHILD_PROCESS_LOG_DIRECTORY: /opt/airflow/logs/dag_processor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-api-server:8080/execution/'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__WEBSERVER__RBAC: 'true'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__CORE__DAGS_FOLDER: '/opt/airflow/dags'
    AIRFLOW__CORE__PLUGINS_FOLDER: '/opt/airflow/plugins'
    AIRFLOW__WEBSERVER__BASE_URL: 'http://localhost:8082'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: 'postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@airflow-postgres/${POSTGRES_DB}'

    # security
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}

    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
    
    # Add GCP and other env vars
    GCP_PROJECT_ID: ${GCP_PROJECT_ID}
    GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}
    BIGQUERY_DATASET: ${BIGQUERY_DATASET}
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/config/gcp/gcp-credentials.json
    SPARK_CONF_DIR: /opt/airflow/config/spark
    # SparkSubmitHook uses --master from this connection; conf spark.master alone does not override it.
    AIRFLOW_CONN_SPARK_DEFAULT: 'spark://spark-master:7077'
    PYTHONPATH: /opt/airflow/src
    
  user: "${AIRFLOW_UID}:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes: &airflow-volumes
    # - ./dags:/opt/airflow/dags
    # - ./src:/opt/airflow/src
    # - ./scripts:/opt/airflow/scripts
    # - ./logs/airflow:/opt/airflow/logs
    # - ./config/airflow:/opt/airflow/config
    # - ./data:/opt/airflow/data
    # - ./spark-apps:/opt/airflow/spark-apps
    # - /var/run/docker.sock:/var/run/docker.sock
    - ./config:/opt/airflow/config
    - ./config/gcp:/opt/airflow/config/gcp:ro
    - ./config/gcp:/opt/spark/config/gcp:ro
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./include:/opt/airflow/include
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./tests:/opt/airflow/tests
  depends_on:
    &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy
  env_file:
    - .env

services:
  # ==================== KAFKA STACK ====================
  zookeeper:
    <<: *defaults
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/2181"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 512m
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    <<: *defaults
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_BYTES: 10737418240
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 90s
    mem_limit: 1g
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    <<: *defaults
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: aerostream-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    mem_limit: 256m

  # ==================== SPARK STACK ====================
  spark-master:
    <<: [*defaults, *spark-common]
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "8080:8080"
      - "7077:7077"
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/7077"]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 90s
    mem_limit: 1g
    environment:
      <<: *spark-common-env
    volumes: *spark-common-volumes

  spark-worker:
    <<: [*defaults, *spark-common]  
    container_name: spark-worker
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--webui-port", "8081", "--cores", "2", "--memory", "2g"]
    mem_limit: 2g
    environment:
      <<: *spark-common-env
    volumes: *spark-common-volumes
    ports:
      - "8081:8081"

  # ==================== INGESTION SERVICE ====================
  ingestion:
    <<: *defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.ingestion
    container_name: ingestion
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    mem_limit: 256m

  # ==================== STREAMING CONSUMER ====================
  streaming:
    <<: [*defaults, *spark-common]
    container_name: streaming
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
    entrypoint:
      - /bin/bash
      - -c
      - |
        mkdir -p /opt/spark/.ivy2/cache /opt/spark/.ivy2/jars
        echo "Waiting for Kafka port..."
        until (exec 3<>/dev/tcp/kafka/9092) 2>/dev/null; do sleep 3; done
        echo "Kafka port open. Waiting 30s for topic/partition leader election..."
        sleep 30
        echo "Starting Spark streaming job..."
        exec /opt/spark/bin/spark-submit \
          --master spark://spark-master:7077 \
          --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.2 \
          --conf spark.jars.ivy=/opt/spark/.ivy2 \
          --conf spark.pyspark.python=python3.11 \
          --conf spark.pyspark.driver.python=python3.11 \
          --conf spark.cores.max=1 \
          /opt/spark/work-dir/src/streaming/stream_flights.py
    environment:
      <<: *spark-common-env
      HOME: /tmp
    volumes: *spark-common-volumes
    mem_limit: 1g

  # ==================== AIRFLOW 3 STACK ====================
  airflow-postgres:
    <<: *defaults
    image: postgres:15
    container_name: airflow-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - airflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  airflow-init:
    <<: [*defaults, *airflow-common]
    container_name: airflow-init
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"
        echo
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:0"
        echo
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WWW_USER_PASSWORD}
    user: "0:0"


  airflow-scheduler:
    <<: [*defaults, *airflow-common]
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "scheduler", "--help"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 1536m
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-api-server:
    <<: [*defaults, *airflow-common]
    container_name: airflow-api-server
    command: api-server
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 768m

  airflow-triggerer:
    <<: [*defaults, *airflow-common]
    container_name: airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD", "airflow", "triggerer", "--help"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: [*defaults, *airflow-common]
    container_name: airflow-dag-processor
    command: airflow dag-processor
    healthcheck:
      test: ["CMD", "airflow", "dag-processor", "--help"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    depends_on:
      airflow-init:
        condition: service_completed_successfully



# ==================== VOLUMES ====================
volumes:
  # Kafka volumes
  zookeeper-data:
    driver: local
  zookeeper-log:
    driver: local
  kafka-data:
    driver: local

  # Airflow volumes
  airflow-postgres:
    driver: local

# ==================== NETWORKS ====================
networks:
  data-platform:
    driver: bridge